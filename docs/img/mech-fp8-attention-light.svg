<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Stock FA2 dequantizes the FP8 KV cache to bf16; patch 01 quantizes Q to FP8 and runs the SM120 FP8 FMHA" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="100%" height="100%" fill="#fcfcfb"/><text x="20.0" y="28.0" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">Patch 01: full-attention prefill on FP8 tensor cores</text><text x="20.0" y="48.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">10 attention layers, FP8 KV cache; prefills with at least 256 query tokens</text><text x="20.0" y="84.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">stock (FA2)</text><rect x="20.0" y="96.0" width="130.0" height="44.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="85.0" y="122.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">Q (bf16)</text><rect x="20.0" y="160.0" width="130.0" height="44.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="85.0" y="186.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">KV cache (fp8)</text><line x1="150.0" y1="118.0" x2="330.0" y2="136.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><line x1="150.0" y1="182.0" x2="330.0" y2="156.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><text x="240.0" y="184.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">dequant to bf16</text><rect x="330.0" y="120.0" width="230.0" height="52.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="445.0" y="146.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="m