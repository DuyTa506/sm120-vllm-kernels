<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Stock vLLM splits a long prompt into two forward passes to save the GDN state; patch 02 runs one pass and exports the state from inside it" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="arrow-c3c2b7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs><rect width="100%" height="100%" fill="#1a1a19"/><text x="20.0" y="28.0" font-size="15" font-weight="600" fill="#f0efec" text-anchor="start">Patch 02: one forward pass per long prompt</text><text x="20.0" y="48.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Mamba prefix caching needs the GDN state at the last block boundary (8192 tokens -&gt; boundary at 4256)</text><text x="20.0" y="84.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">stock vLLM</text><rect x="20.0" y="96.0" width="140.0" height="50.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="90.0" y="125.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">8192-token prompt</text><line x1="160.0" y1="121.0" x2="240.0" y2="121.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><text x="200.0" y="114.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">scheduler</text><rect x="240.0" y="96.0" width="160.0" height="50.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="320.0" y="121.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">forward pass 1</text><text x="320.0" y="135.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">tokens 0-4255, 40 layers</text><line x1="400.0" y1="121.0" x2="460.0" y2="121.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><text x="430.0" y="114.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">state</text><rect x="460.0" y="96.0" width="140.0" height="50.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="530.0" y="121.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">save checkpoint</text><text x="530.0" y="135.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">GDN + conv state</text><line x1="600.0" y1="121.0" x2="640.0" y2="121.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><rect x="640.0" y="96.0" width="160.0" height="50.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="720.0" y="121.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">forward pass 2</text><text x="720.0" y="135.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">tokens 4256-8191</text><text x="20.0" y="170.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">every weight is read twice and per-pass overheads are paid twice; GEMMs run at half the token count</text><text x="20.0" y="214.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">with patch 02</text><rect x="20.0" y="226.0" width="140.0" height="50.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="90.0" y="255.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">8192-token prompt</text><line x1="160.0" y1="251.0" x2="240.0" y2="251.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><text x="200.0" y="244.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">scheduler</text><rect x="240.0" y="226.0" width="280.0" height="50.0" rx="6" fill="#262624" stroke="#3987e5" stroke-width="1.5"/><text x="380.0" y="251.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">one forward pass</text><text x="380.0" y="265.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">FlashInfer GDN writes state every 64 tokens</text><line x1="520.0" y1="251.0" x2="600.0" y2="251.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><text x="560.0" y="244.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">pick 4256</text><rect x="600.0" y="226.0" width="200.0" height="50.0" rx="6" fill="#262624" stroke="#3987e5" stroke-width="1.5"/><text x="700.0" y="251.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">export checkpoint</text><text x="700.0" y="265.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">into the prefix-cache block</text><text x="20.0" y="300.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">same cached state (kernel output bit-identical with and without checkpoints); 8k span 145 -&gt; 133 ms</text></svg>
