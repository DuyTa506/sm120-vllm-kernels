<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Replaying only the accepted tokens from one committed GDN state avoids writing a state for every speculative position" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="arrow-c3c2b7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs><rect width="100%" height="100%" fill="#1a1a19"/><text x="20.0" y="28.0" font-size="15" font-weight="600" fill="#f0efec" text-anchor="start">next lever (not built): replay accepted tokens from one committed state</text><text x="20.0" y="48.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">GDN decode with MTP-2 verifies 3 positions per step; at c=64 the state writes are 10.6 ms of a 29 ms step</text><text x="20.0" y="84.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">now</text><rect x="20.0" y="96.0" width="130.0" height="46.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="85.0" y="119.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">state s0 (fp32)</text><text x="85.0" y="133.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">read</text><line x1="150.0" y1="119.0" x2="200.0" y2="119.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><rect x="200.0" y="96.0" width="110.0" height="46.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="255.0" y="119.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">position 1</text><text x="255.0" y="133.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">writes a state</text><line x1="310.0" y1="119.0" x2="330.0" y2="119.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><rect x="330.0" y="96.0" width="110.0" height="46.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="385.0" y="119.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">position 2</text><text x="385.0" y="133.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">writes a state</text><line x1="440.0" y1="119.0" x2="460.0" y2="119.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><rect x="460.0" y="96.0" width="110.0" height="46.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="515.0" y="119.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">position 3</text><text x="515.0" y="133.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">writes a state</text><line x1="570.0" y1="119.0" x2="620.0" y2="119.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><rect x="620.0" y="96.0" width="110.0" height="46.0" rx="6" fill="#1a1a19" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="675.0" y="119.0" font-size="12" font-weight="600" fill="#898781" text-anchor="middle">accepted</text><text x="675.0" y="133.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">keeps one</text><text x="20.0" y="166.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">every speculative position writes a full fp32 state to HBM, and only one of the three is kept</text><text x="20.0" y="210.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">replay (decode-roofline README section 5)</text><rect x="20.0" y="222.0" width="130.0" height="46.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="85.0" y="245.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">state s0</text><text x="85.0" y="259.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">committed</text><line x1="150.0" y1="245.0" x2="200.0" y2="245.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><rect x="200.0" y="222.0" width="270.0" height="46.0" rx="6" fill="#262624" stroke="#3987e5" stroke-width="1.5"/><text x="335.0" y="245.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">verify 3 positions, no state writes</text><text x="335.0" y="259.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">outputs only</text><line x1="470.0" y1="245.0" x2="520.0" y2="245.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><text x="495.0" y="238.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">accepted n</text><rect x="520.0" y="222.0" width="210.0" height="46.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="625.0" y="245.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">replay n tokens once</text><text x="625.0" y="259.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">write one state</text><text x="20.0" y="290.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">about -5 ms per step at c=64 (~-18%); needs a new GDN decode kernel and GPU time to verify</text></svg>
