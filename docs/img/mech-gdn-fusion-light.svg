<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The fused kernel reads mixed_qkv once and writes q, k, v, removing the HBM round trip of the conv output" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="100%" height="100%" fill="#fcfcfb"/><text x="20.0" y="28.0" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">kernels/gdn-conv-fusion: one pass over HBM instead of two</text><text x="20.0" y="48.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">GDN prefill front end, per layer, 8192 tokens x 8192 channels bf16 (128 MB)</text><text x="20.0" y="84.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">before</text><rect x="20.0" y="96.0" width="120.0" height="46.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="80.0" y="119.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">mixed_qkv</text><text x="80.0" y="133.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">HBM</text><line x1="140.0" y1="119.0" x2="190.0" y2="119.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><text x="165.0" y="112.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">read</text><rect x="190.0" y="96.0" width="130.0" height="46.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="255.0" y="119.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">causal conv1d</text><text x="255.0" y="133.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">197 us</text><line x1="320.0" y1="119.0" x2="370.0" y2="119.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><text x="345.0" y="112.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">write</text><rect x="370.0" y="96.0" width="110.0" height="46.0" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="425.0" y="119.0" font-size="12" font-weight="600" fill="#898781" text-anchor="middle">conv out</text><text x="425.0" y="133.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">HBM, 128 MB</text><line x1="480.0" y1="119.0" x2="530.0" y2="119.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><text x="505.0" y="112.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">read</text><rect x="530.0" y="96.0" width="130.0" height="46.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="595.0" y="119.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">post-conv prep</text><text x="595.0" y="133.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">split, l2norm, g, beta</text><line x1="660.0" y1="119.0" x2="700.0" y2="119.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><text x="704.0" y="123.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">q k v</text><text x="20.0" y="166.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">377 us per layer-call; the conv output makes a full round trip through HBM</text><text x="20.0" y="210.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">fused</text><rect x="20.0" y="222.0" width="120.0" height="46.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="80.0" y="245.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">mixed_qkv</text><text x="80.0" y="259.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">HBM</text><line x1="140.0" y1="245.0" x2="220.0" y2="245.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><text x="180.0" y="238.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">read once</text><rect x="220.0" y="222.0" width="440.0" height="46.0" rx="6" fill="#f0efec" stroke="#2a78d6" stroke-width="1.5"/><text x="440.0" y="245.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">fused conv1d + post-conv</text><text x="440.0" y="259.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">conv state and prefix-cache bookkeeping unchanged</text><line x1="660.0" y1="245.0" x2="700.0" y2="245.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><text x="704.0" y="249.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">q k v</text><text x="20.0" y="290.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">190 us (1.43 TB/s, at the copy floor); x30 layers saves ~5.6 ms per 8k prefill</text></svg>
