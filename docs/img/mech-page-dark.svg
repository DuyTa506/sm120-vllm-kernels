<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Patch 04 keeps the 2176-token cache block for the GDN checkpoint but lets the attention kernel use 16-token pages" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="arrow-c3c2b7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs><rect width="100%" height="100%" fill="#1a1a19"/><text x="20.0" y="28.0" font-size="15" font-weight="600" fill="#f0efec" text-anchor="start">patch 04: the cache block and the kernel page are different things</text><text x="20.0" y="48.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">block 2176 tokens (a multiple of 64) for the GDN checkpoint; the attention kernel can still read 16-token pages</text><text x="20.0" y="84.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">before (optimized): one size for both</text><rect x="20.0" y="96.0" width="210.0" height="46.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="125.0" y="119.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">cache block = 2176</text><text x="125.0" y="133.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">GDN checkpoint aligned</text><line x1="230.0" y1="119.0" x2="290.0" y2="119.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><text x="260.0" y="112.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">forces</text><rect x="290.0" y="96.0" width="210.0" height="46.0" rx="6" fill="#1a1a19" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="395.0" y="119.0" font-size="12" font-weight="600" fill="#898781" text-anchor="middle">kernel page = 64</text><text x="395.0" y="133.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">page64 costs decode</text><line x1="500.0" y1="119.0" x2="560.0" y2="119.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><rect x="560.0" y="96.0" width="170.0" height="46.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="645.0" y="119.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">c=64 decode -4%</text><text x="645.0" y="133.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">3532 vs ~3680 tok/s</text><text x="20.0" y="186.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">after (patch 04, VLLM_FI_KERNEL_PAGES=16)</text><rect x="20.0" y="198.0" width="210.0" height="46.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="125.0" y="221.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">cache block = 2176</text><text x="125.0" y="235.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">unchanged</text><line x1="230.0" y1="221.0" x2="290.0" y2="221.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><text x="260.0" y="214.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">viewed as</text><rect x="290.0" y="198.0" width="210.0" height="46.0" rx="6" fill="#262624" stroke="#3987e5" stroke-width="1.5"/><text x="395.0" y="221.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">kernel page = 16</text><text x="395.0" y="235.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">136 pages per block</text><line x1="500.0" y1="221.0" x2="560.0" y2="221.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow-c3c2b7)" stroke-linecap="round"/><rect x="560.0" y="198.0" width="170.0" height="46.0" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="1.5"/><text x="645.0" y="221.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">decode back to par</text><text x="645.0" y="235.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">prefill unchanged</text><text x="20.0" y="274.0" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">KV capacity does not depend on page size: the drop from 3.98M to 3.37M tokens comes from the memory of patches 01/02</text></svg>
