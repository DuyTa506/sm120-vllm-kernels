<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="With block-aligned GDN state caching every turn recomputes the old tail; a finer unit or a per-session state removes it" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><defs></defs><rect width="100%" height="100%" fill="#fcfcfb"/><text x="20.0" y="28.0" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">Why each agent turn re-prefills old tokens</text><text x="20.0" y="48.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">turn N+1 prompt = turn N prompt + model output + tool result; the GDN state can only resume where it was saved</text><text x="20.0" y="100.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">stock</text><text x="20.0" y="116.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">state saved every 2128 tokens</text><rect x="210.0" y="84.0" width="342.2" height="30.0" rx="4" fill="#f0efec" stroke="#898781" stroke-width="1.5"/><text x="381.1" y="104.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">prefix from cache</text><rect x="552.2" y="84.0" width="129.8" height="30.0" rx="4" fill="#eb6834"/><text x="617.1" y="104.0" font-size="11" font-weight="400" fill="#fcfcfb" text-anchor="middle">recomputed old tokens</text><rect x="682.0" y="84.0" width="118.0" height="30.0" rx="4" fill="#7c5ccf"/><text x="741.0" y="104.0" font-size="11" font-weight="400" fill="#fcfcfb" text-anchor="middle">new tokens</text><line x1="552.2" y1="78.0" x2="552.2" y2="122.0" stroke="#52514e" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><text x="552.2" y="136.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">last 2128-token boundary</text><text x="20.0" y="176.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">--prefix-match-unit 16</text><text x="20.0" y="192.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">state saved every 16 tokens</text><rect x="210.0" y="160.0" width="469.1" height="30.0" rx="4" fill="#f0efec" stroke="#898781" stroke-width="1.5"/><text x="444.5" y="180.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">prefix from cache</text><rect x="682.0" y="160.0" width="118.0" height="30.0" rx="4" fill="#7c5ccf"/><text x="741.0" y="180.0" font-size="11" font-weight="400" fill="#fcfcfb" text-anchor="middle">new tokens</text><text x="20.0" y="252.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">session state cache</text><text x="20.0" y="268.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">state kept at the end of turn N</text><rect x="210.0" y="236.0" width="472.0" height="30.0" rx="4" fill="#f0efec" stroke="#898781" stroke-width="1.5"/><text x="446.0" y="256.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">prefix from cache</text><rect x="682.0" y="236.0" width="118.0" height="30.0" rx="4" fill="#7c5ccf"/><text x="741.0" y="256.0" font-size="11" font-weight="400" fill="#fcfcfb" text-anchor="middle">new tokens</text><text x="20.0" y="312.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">measured on long sessions: ~1,740 new tokens per turn, stock prefills ~4,760; unit 16 prefills ~1,765</text></svg>
