<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Stock b12x loses precision in the block scales and zeroes 1-3 token outputs; the hybrid uses CUTLASS below 1024 tokens and the fixed b12x above" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="arrow-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect width="100%" height="100%" fill="#fcfcfb"/><text x="20.0" y="28.0" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">kernels/moe-nvfp4: fix the b12x scales, use it only where it wins</text><text x="20.0" y="48.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">NVFP4 MoE, 256 experts top-8; the token count of the step picks the backend</text><text x="20.0" y="84.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">bug in stock b12x</text><rect x="20.0" y="96.0" width="150.0" height="46.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="95.0" y="119.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">block scales</text><text x="95.0" y="133.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">e4m3, per 16 values</text><line x1="170.0" y1="119.0" x2="230.0" y2="119.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><text x="200.0" y="112.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">baked into</text><rect x="230.0" y="96.0" width="190.0" height="46.0" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="325.0" y="119.0" font-size="12" font-weight="600" fill="#898781" text-anchor="middle">e4m3 subnormals</text><text x="325.0" y="133.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">precision lost</text><line x1="420.0" y1="119.0" x2="480.0" y2="119.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><rect x="480.0" y="96.0" width="250.0" height="46.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="605.0" y="119.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">quality drop vs CUTLASS</text><text x="605.0" y="133.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">NLL, long-context needles</text><text x="20.0" y="166.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">also: a scale-convention mismatch in FlashInfer zeroes the output for 1-3 token steps (decode with MTP)</text><text x="20.0" y="206.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">fix + hybrid dispatch (VLLM_B12X_FIX_SCALES, VLLM_B12X_HYBRID_MIN_TOKENS)</text><rect x="20.0" y="216.0" width="190.0" height="52.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="115.0" y="242.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">tokens in the step</text><text x="115.0" y="256.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">decode 1-192, prefill 8k+</text><line x1="210.0" y1="232.0" x2="280.0" y2="238.0" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#arrow-2a78d6)" stroke-linecap="round"/><text x="245.0" y="228.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">&lt; 1024</text><rect x="280.0" y="216.0" width="200.0" height="44.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="380.0" y="238.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">CUTLASS FP4 MoE</text><text x="380.0" y="252.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">small M: stock path</text><line x1="210.0" y1="256.0" x2="280.0" y2="292.0" stroke="#eb6834" stroke-width="1.5" marker-end="url(#arrow-eb6834)" stroke-linecap="round"/><text x="245.0" y="289.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">&gt;= 1024</text><rect x="280.0" y="272.0" width="200.0" height="44.0" rx="6" fill="#f0efec" stroke="#2a78d6" stroke-width="1.5"/><text x="380.0" y="294.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">b12x, scales fixed</text><text x="380.0" y="308.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">631 vs 871 us per layer at 8k</text><text x="510.0" y="242.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">8k TTFT -4.7%; NLL, needles 20/20,</text><text x="510.0" y="258.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">MTP acceptance unchanged (author)</text><text x="510.0" y="294.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start">independent verification still running</text></svg>
