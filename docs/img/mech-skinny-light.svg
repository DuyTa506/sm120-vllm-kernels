<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A skinny GEMM spreads the K dimension over many CTAs where cuBLAS uses 4 to 16, cutting the router and in_proj_ba cost at M=1 to 3" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="100%" height="100%" fill="#fcfcfb"/><text x="20.0" y="28.0" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">kernels/decode-roofline, dense-fp8-gemm: skinny GEMMs for decode</text><text x="20.0" y="48.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">decode multiplies 1-3 token rows by small weights; cuBLAS launches only 4-16 CTAs there</text><text x="20.0" y="84.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">cuBLAS, M = 2-3 rows</text><rect x="20.0" y="96.0" width="130.0" height="46.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="85.0" y="119.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">router 256x2048</text><text x="85.0" y="133.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">or in_proj_ba 64x2048</text><line x1="150.0" y1="119.0" x2="220.0" y2="119.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><text x="185.0" y="112.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">launch</text><rect x="220.0" y="96.0" width="200.0" height="46.0" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="320.0" y="119.0" font-size="12" font-weight="600" fill="#898781" text-anchor="middle">4-16 single-warp CTAs</text><text x="320.0" y="133.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">of 188 SMs (wmma 16x16)</text><line x1="420.0" y1="119.0" x2="480.0" y2="119.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><rect x="480.0" y="96.0" width="250.0" height="46.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="605.0" y="119.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">11.5 us / 7.3 us</text><text x="605.0" y="133.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">router M=2-3 / in_proj_ba</text><text x="20.0" y="186.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">skinny kernel (VLLM_SKINNY_BF16_GEMM, VLLM_SM120_SKINNY_FP8)</text><rect x="20.0" y="198.0" width="130.0" height="46.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="85.0" y="221.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">same weights</text><text x="85.0" y="235.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">same rows (M &lt;= 16)</text><line x1="150.0" y1="221.0" x2="220.0" y2="221.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><text x="185.0" y="214.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">launch</text><rect x="220.0" y="198.0" width="200.0" height="46.0" rx="6" fill="#f0efec" stroke="#2a78d6" stroke-width="1.5"/><text x="320.0" y="221.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">weights spread over CTAs</text><text x="320.0" y="235.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">fp32 accumulate, one bf16 round</text><line x1="420.0" y1="221.0" x2="480.0" y2="221.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-52514e)" stroke-linecap="round"/><rect x="480.0" y="198.0" width="250.0" height="46.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="605.0" y="221.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">2.6-3.4 us / 1.6-2.0 us</text><text x="605.0" y="235.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">matches cuBLAS to bf16 rounding</text><text x="20.0" y="276.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">x40 router + x30 in_proj_ba per step = ~0.6 ms at c=1, nothing at c &gt;= 4 (verifier); FP8 variant ~0.19 ms</text></svg>
